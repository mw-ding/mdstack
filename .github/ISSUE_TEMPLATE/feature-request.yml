name: Feature request
description: Propose a new capability or a change to existing behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The crew builds accepted requests as issues with acceptance criteria. Never paste tokens, keys, emails or private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest. Name the docs, scripts or templates it touches if you know them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer can tell the change is done.
      placeholder: |
        - [ ]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
